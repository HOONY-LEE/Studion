name: Studion
options:
  bundleIdPrefix: com.studion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # Localizable.xcstrings의 sourceLanguage("ko")와 맞춘다.
  # 어긋나면 tabItem 같은 네이티브(UIKit) 라벨이 시스템 언어와 무관하게
  # 항상 en.lproj로 떨어져 언어가 뒤섞여 보인다.
  developmentLanguage: ko

configs:
  Debug: debug
  Release: release

packages:
  # 개발자 탭(팀 내부 메신저) 전용. #if DEBUG로만 호출한다 — docs/10-developer-chat.md.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Studion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Studion
    info:
      path: Studion/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Studion
        # TestFlight는 같은 버전(1.0)에 빌드 번호가 겹치면 재업로드를 막는다 — 올릴 때마다 올린다.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "7"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 오답노트·시간표 사진용. 사진은 기기 안에서만 분석되며 외부로 전송되지 않는다.
        NSCameraUsageDescription: 틀린 문제나 시간표를 찍어 오답노트·시간표를 만들 때 사용합니다. 사진은 기기 안에서만 분석되며 외부로 전송되지 않습니다.
        NSPhotoLibraryUsageDescription: 저장된 문제·시간표 사진으로 오답노트·시간표를 만들 때 사용합니다. 사진은 기기 안에서만 분석되며 외부로 전송되지 않습니다.
        # 플래너 월간 보기용. iOS 17부터 읽기 전용/전체 접근 키가 나뉘는데, 앱에서 일정을
        # 추가·수정까지 하므로 전체 접근 키를 쓴다. 일정은 기기의 캘린더에만 오가며
        # (iCloud·Google 등 계정 동기화는 iOS가 담당) 개발자 서버로 보내지 않는다.
        NSCalendarsFullAccessUsageDescription: 월간 달력에 일정을 보여주고, 앱에서 일정을 추가·수정할 때 사용합니다. 일정은 기기의 캘린더에만 저장되며 외부로 전송되지 않습니다.
        # CloudKit 원격 변경 수신용
        UIBackgroundModes:
          - remote-notification
        # 팀 메신저(설정 맨 위)용 Supabase 연결 정보. 호스트는 Config/DevChatSecrets*.xcconfig에서 온다.
        # "https://"는 여기서 붙인다 — xcconfig 쪽에 두면 `//`가 주석으로 잘린다 (겪은 버그, docs/10 참고).
        DevChatSupabaseURL: https://$(DEV_CHAT_SUPABASE_HOST)
        DevChatSupabaseAnonKey: $(DEV_CHAT_SUPABASE_ANON_KEY)
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studion.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SWIFT_EMIT_LOC_STRINGS: YES
        # 실기기 빌드용 서명. 시뮬레이터는 서명 없이도 동작한다.
        # SUNGHOON LEE — iCloud·Sign in with Apple 프로파일이 정상 발급되는 유료 멤버십 팀
        # (TestFlight 업로드로 실제 확인함 — 예전 주석은 이 팀을 무료 개인 팀으로 잘못 적어뒀었다).
        DEVELOPMENT_TEAM: TXP6GR8NMT
        CODE_SIGN_STYLE: Automatic
      configs:
        # 무료 Apple ID로 실기기에 설치할 수 있도록 entitlement를 비운다.
        # iCloud·Sign in with Apple은 유료 멤버십이 있어야 프로파일이 발급된다.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/StudionLocal.entitlements
        # 유료 멤버십 승인 후 동기화까지 포함해 빌드하는 구성.
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Studion.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: CLOUD_SYNC
    configFiles:
      # 팀 메신저가 Release(TestFlight 포함)에서도 열리므로 두 구성 다 이 xcconfig를 본다.
      Debug: Config/DevChatSecrets.xcconfig
      Release: Config/DevChatSecrets.xcconfig

  StudionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StudionTests
    dependencies:
      - target: Studion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Studion:
    build:
      targets:
        Studion: all
        StudionTests: [test]
    test:
      targets:
        - StudionTests
    run:
      config: Debug
