name: Studion
options:
  bundleIdPrefix: com.studion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Studion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Studion
    info:
      path: Studion/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Studion
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 오답노트용. 사진은 기기 안에서만 분석되며 외부로 전송되지 않는다.
        NSCameraUsageDescription: 틀린 문제를 찍어 오답노트를 만들 때 사용합니다. 사진은 기기 안에서만 분석되며 외부로 전송되지 않습니다.
        NSPhotoLibraryUsageDescription: 저장된 문제 사진으로 오답노트를 만들 때 사용합니다. 사진은 기기 안에서만 분석되며 외부로 전송되지 않습니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studion.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SWIFT_EMIT_LOC_STRINGS: YES
        # 실기기 빌드용 서명. 시뮬레이터는 서명 없이도 동작한다.
        DEVELOPMENT_TEAM: 2J399JB6Q6
        CODE_SIGN_STYLE: Automatic
    # CloudKit entitlement (iCloud 컨테이너 연결)은 7단계(Sign in with Apple + CloudKit 동기화)에서
    # 실제 개발자 팀 ID로 추가한다. 지금은 SwiftData 스키마만 CloudKit 호환 형태로 설계해둔다.

  StudionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StudionTests
    dependencies:
      - target: Studion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Studion:
    build:
      targets:
        Studion: all
        StudionTests: [test]
    test:
      targets:
        - StudionTests
    run:
      config: Debug
